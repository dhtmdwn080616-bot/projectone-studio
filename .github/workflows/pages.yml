# 정적 사이트를 GitHub Pages로 배포한다. Settings > Pages > Source = "GitHub Actions"
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Block deploy if placeholders remain
        run: |
          if grep -rn "\[대표 확정" --include=*.html .; then echo "placeholders remain"; exit 1; fi
      - name: Stage site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r photo-size quote-maker portfolio _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
