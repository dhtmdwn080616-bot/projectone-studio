<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로젝트원스튜디오</title>
<meta name="description" content="프로젝트원스튜디오의 무료 웹 도구와 제작 샘플 모음">
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b7280;--card:#f5f6f8;--c:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#f2f2f3;--mut:#9ca3af;--card:#1e1e22}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
.w{max-width:880px;margin:0 auto;padding:0 20px}header{padding:64px 0 40px}h1{font-size:clamp(28px,6vw,42px);margin:0 0 8px}
header p{color:var(--mut);margin:0;font-size:18px}h2{font-size:22px;margin:40px 0 16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:block;background:var(--card);border-radius:16px;padding:24px;text-decoration:none;color:inherit}
a.card:hover,a.card:focus-visible{outline:2px solid var(--c)}a.card b{display:block;font-size:19px;color:var(--c);margin-bottom:6px}a.card span{color:var(--mut);font-size:15px}
footer{padding:40px 0;color:var(--mut);font-size:13px}
</style></head><body>
<header><div class="w"><h1>프로젝트원스튜디오</h1><p>브라우저에서 바로 쓰는 무료 도구와 제작 샘플</p></div></header>
<main class="w">
<h2>도구</h2>
<div class="g"><a class="card" href="photo-size/"><b>증명·여권사진 규격 맞추기</b><span>사진을 서버로 보내지 않고 브라우저 안에서 자르고 용량을 줄입니다.</span></a><a class="card" href="quote-maker/"><b>견적서·거래명세서 생성기</b><span>입력한 내용은 브라우저 안에서만 처리됩니다. 양식 작성 보조 도구이며 세금계산서가 아닙니다.</span></a></div>
<h2>제작 샘플</h2>
<div class="g"><a class="card" href="portfolio/"><b>홈페이지 제작 샘플</b><span>가상 업체로 만든 시연용 샘플입니다. 실제 의뢰 실적이 아닙니다.</span></a></div>
</main>
<footer><div class="w">© 프로젝트원스튜디오 · AI(Claude)를 활용해 제작하고 운영자가 검수합니다.</div></footer>
</body></html>
