<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모닝브루 카페 (샘플)</title>
<style>
:root{--c:#8b5a2b;--bg:#fff;--fg:#1c1c1e;--mut:#6b7280;--card:#f5f6f8}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#f2f2f3;--mut:#9ca3af;--card:#1e1e22}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
.w{max-width:960px;margin:0 auto;padding:0 20px}
header{padding:80px 0 60px;background:linear-gradient(135deg,var(--c),#0003);color:#fff}
h1{font-size:clamp(28px,6vw,48px);margin:0 0 12px}header p{font-size:18px;margin:0 0 28px;opacity:.95}
.btn{display:inline-block;background:#fff;color:var(--c);padding:14px 28px;border-radius:999px;font-weight:700;text-decoration:none}
section{padding:56px 0}h2{font-size:28px;margin:0 0 24px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border-radius:16px;padding:24px}.card h3{margin:0 0 8px;color:var(--c)}.card p{margin:0;color:var(--mut)}
footer{padding:32px 0;color:var(--mut);font-size:13px;border-top:1px solid var(--card)}
.sample-bar{background:#222;color:#fff;font-size:13px;text-align:center;padding:8px 12px}
</style></head><body>
<div class="sample-bar">가상 업체 제작 샘플입니다. 실제 영업 중인 업체가 아니며 업체명·문구는 예시입니다.</div>
<header><div class="w"><h1>모닝브루 카페</h1><p>직접 로스팅한 원두, 하루를 여는 한 잔</p><a class="btn" href="#contact">문의하기</a></div></header>
<main class="w">
<section><h2>서비스</h2><div class="g"><div class="card"><h3>스페셜티커피</h3><p>산미와 단맛의 균형을 맞춘 시즌 원두</p></div><div class="card"><h3>수제디저트</h3><p>매일 아침 구운 스콘과 케이크</p></div><div class="card"><h3>원두판매</h3><p>200g 단위 소포장, 전국 택배</p></div></div></section>
<section><h2>영업시간</h2><div class="card"><p>평일 08:00–21:00 · 주말 09:00–20:00</p></div></section>
<section id="contact"><h2>문의</h2><div class="card"><h3>전화 · 카카오톡 채널</h3><p>연락처는 실제 제작 시 고객 정보로 교체됩니다.</p></div></section>
</main>
<footer><div class="w">※ 본 페이지는 Project1 제작 샘플이며 가상의 업체입니다.</div></footer>
</body></html>
